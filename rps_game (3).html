<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 가위바위보</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: #fff; text-align: center;
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #3b1a7a 0%, transparent 55%),
                radial-gradient(ellipse at 50% 100%, #0b4f7a 0%, transparent 55%),
                #06061a;
    padding: 20px 16px 40px;
  }

  /* 1. 제목 + 이미지 */
  .title-row { display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; }
  h1 {
    margin: 0; font-size: 40px; letter-spacing: 1px;
    background: linear-gradient(90deg, #ff6ec4, #7873f5, #4ade80);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hands { font-size: 44px; display: flex; gap: 10px; }
  .hands span { display: inline-block; animation: bob 1.8s ease-in-out infinite; }
  .hands span:nth-child(2) { animation-delay: .25s; }
  .hands span:nth-child(3) { animation-delay: .5s; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-8px) rotate(6deg); } }

  /* 2. 버튼 */
  .buttons { margin: 18px 0; display: flex; gap: 14px; justify-content: center; }
  button {
    font-family: inherit; font-size: 18px; font-weight: 700; color: #fff;
    padding: 12px 34px; border: none; border-radius: 999px; cursor: pointer;
    transition: transform .15s, box-shadow .15s, opacity .15s;
  }
  button:hover:not(:disabled) { transform: translateY(-2px) scale(1.04); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #startBtn { background: linear-gradient(135deg, #22c55e, #0f9d8a); box-shadow: 0 6px 20px #22c55e66; }
  #stopBtn  { background: linear-gradient(135deg, #f43f5e, #b91c5c); box-shadow: 0 6px 20px #f43f5e66; }

  /* 3. 카메라 */
  .stage {
    position: relative; width: 100%; max-width: 640px; aspect-ratio: 4 / 3; margin: 0 auto;
    border-radius: 24px; overflow: hidden; background: #000;
    border: 2px solid rgba(255,255,255,.18);
    box-shadow: 0 0 40px rgba(120,115,245,.4), inset 0 0 30px rgba(0,0,0,.4);
  }
  .stage video, .stage canvas.ov { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); }
  .pill {
    position: absolute; padding: 6px 14px; border-radius: 999px; font-size: 13px; z-index: 5;
    background: rgba(10,10,30,.65); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.2);
  }
  #status { left: 12px; bottom: 12px; }
  #countdown {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 5;
    font-size: 22px; font-weight: 700; padding: 6px 20px; border-radius: 999px;
    background: rgba(10,10,30,.7); border: 1px solid rgba(255,255,255,.3); display: none;
  }
  #crop {
    position: absolute; right: 12px; bottom: 12px; width: 84px; height: 84px; z-index: 5;
    border-radius: 12px; border: 2px solid rgba(255,255,255,.35); background: #000;
  }

  /* 4. 결과 패널 */
  .panel {
    max-width: 640px; margin: 20px auto 0; padding: 18px 20px; border-radius: 20px;
    background: rgba(255,255,255,.08); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.15); font-size: 21px; line-height: 2; text-align: left;
  }
  .panel b { color: #a5b4fc; }
  #result { font-size: 26px; font-weight: 700; }
  #result.win  { color: #4ade80; }
  #result.lose { color: #f87171; }
  #result.draw { color: #fde047; }

  /* 5. 점수 */
  .score { display: flex; justify-content: center; gap: 14px; margin: 16px auto 0; max-width: 640px; }
  .score div {
    flex: 1; padding: 12px 8px; border-radius: 16px; font-size: 20px; font-weight: 700;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
  }
  .score .w { color: #4ade80; } .score .d { color: #fde047; } .score .l { color: #f87171; }

  /* 레이어 순서: 배경(0) < 화면 내용(1) < 폭죽(100) */
  .title-row, .buttons, .panel, .score, .stage { position: relative; z-index: 1; }
  .stage { position: relative; }

  /* 7. 배경: 우주 + 디스코 조명 + 빙글빙글 도는 고양이 */
  .bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; perspective: 700px; }

  .rays {
    position: absolute; left: 50%; top: 50%; width: 230vmax; height: 230vmax;
    background: conic-gradient(from 0deg,
      rgba(255,0,200,.20), transparent 9%, rgba(0,200,255,.20) 18%, transparent 27%,
      rgba(255,230,0,.16) 36%, transparent 45%, rgba(0,255,150,.18) 54%, transparent 63%,
      rgba(160,80,255,.20) 72%, transparent 81%, rgba(255,80,80,.18) 90%, transparent 100%);
    animation: raySpin 18s linear infinite;
  }
  @keyframes raySpin { from { transform: translate(-50%,-50%) rotate(0); } to { transform: translate(-50%,-50%) rotate(360deg); } }

  .star { position: absolute; border-radius: 50%; animation: twinkle 1.6s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.4); } }

  .ball { position: absolute; top: 0; transform-origin: 50% 0; animation: swing 3s ease-in-out infinite; }
  .ball .line { width: 2px; background: #aab; margin: 0 auto; }
  .ball .orb { font-size: 56px; line-height: 1; filter: drop-shadow(0 0 14px #fff8); }
  @keyframes swing { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }

  .oiia { position: absolute; animation: hop 1.1s ease-in-out infinite; filter: drop-shadow(0 0 10px rgba(255,255,255,.35)); }
  .oiia svg { width: 100%; height: 100%; overflow: visible; display: block;
              animation: spinY var(--spd, .6s) linear infinite; }
  .oiia svg.rev { animation-direction: reverse; }
  @keyframes spinY { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
  @keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
  .bg.party .oiia svg { animation-duration: .2s !important; }
  .bg.party .oiia { animation-duration: .35s; }
  .bg.party .rays { animation-duration: 3s; }

  /* 6. 폭죽 */
  #fireworks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
</style>
</head>
<body>

  <!-- 고양이 도안 (직접 그린 고양이) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="catSym" viewBox="0 0 100 130">
        <path d="M68 108 C97 104 99 78 84 72" fill="none" stroke="var(--fur)" stroke-width="9" stroke-linecap="round"/>

  </svg>

  <div class="bg" id="bg"><div class="rays"></div></div>

  <!-- 1. 제목 -->
  <div class="title-row">
    <div class="hands"><span>✊</span><span>✋</span><span>✌️</span></div>
    <h1>AI 가위바위보</h1>
    <div class="hands"><span>✌️</span><span>✋</span><span>✊</span></div>
  </div>

  <!-- 2. 버튼 -->
  <div class="buttons">
    <button id="startBtn" disabled>게임 시작</button>
    <button id="stopBtn" disabled>게임 종료</button>
  </div>

  <!-- 3. 카메라 -->
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay" class="ov"></canvas>
    <div id="countdown"></div>
    <div id="status" class="pill">준비 중...</div>
    <canvas id="crop" width="224" height="224"></canvas>
  </div>

  <!-- 4. 결과 -->
  <div class="panel">
    <div>내 제스처(AI 인식) : <b id="myGesture">-</b></div>
    <div>컴퓨터 : <b id="comGesture">-</b></div>
    <div>결과 : <span id="result">-</span></div>
  </div>

  <!-- 5. 점수 -->
  <div class="score">
    <div class="w">승 : <span id="winCnt">0</span></div>
    <div class="d">무승부 : <span id="drawCnt">0</span></div>
    <div class="l">패 : <span id="loseCnt">0</span></div>
  </div>

  <canvas id="fireworks"></canvas>

<script type="module">
  import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

  const MODEL_ID = "s-workspace-jlyia/rock-paper-scissor-p13xv-tot6e-1-vit-base-patch16-224-in21k-t1";
  const API_KEY  = "ZbSf832dtBmgTnuMKm24";
  const API_URL  = `https://serverless.roboflow.com/${MODEL_ID}?api_key=${API_KEY}`;

  const CLASSIFY_INTERVAL = 400;   // 실시간 인식 주기(ms)
  const ROUND_SECONDS = 5;         // 게임 진행 간격(초)
  const PAD = 0.2;                 // 손 박스 여백
  const VOTE_SIZE = 5;             // 최근 N회 다수결

  const INFO = {
    rock:     { ko: "바위", emoji: "✊" },
    paper:    { ko: "보",   emoji: "✋" },
    scissors: { ko: "가위", emoji: "✌️" },
  };
  const BEATS = { rock: "scissors", scissors: "paper", paper: "rock" }; // key가 value를 이긴다
  const pick = (name) => Object.keys(INFO).find(k => String(name).toLowerCase().includes(k));
  const label = (k) => `${INFO[k].emoji} ${INFO[k].ko}`;

  const $ = (id) => document.getElementById(id);
  const video = $("video"), overlay = $("overlay"), octx = overlay.getContext("2d");
  const crop = $("crop"), cctx = crop.getContext("2d");
  const setStatus = (t) => $("status").textContent = t;

  let landmarker, box = null, busy = false, votes = [];
  let running = false, nextRoundAt = 0, lockUntil = 0;
  const score = { win: 0, draw: 0, lose: 0 };

  // ---------- 배경 만들기 (우주 별 + 미러볼 + 도는 고양이) ----------
  (function makeBackground() {
    const bg = $("bg");
    const rnd = (a, b) => a + Math.random() * (b - a);

    // 반짝이는 별/글리터
    const colors = ["#fff", "#ff6ec4", "#7df9ff", "#ffe066", "#8affc1", "#c4a0ff"];
    for (let i = 0; i < 70; i++) {
      const s = document.createElement("div");
      const size = rnd(2, 6);
      s.className = "star";
      s.style.cssText = `left:${rnd(0, 100)}%;top:${rnd(0, 100)}%;width:${size}px;height:${size}px;` +
        `background:${colors[i % colors.length]};box-shadow:0 0 ${size * 2}px ${colors[i % colors.length]};` +
        `animation-delay:${rnd(0, 2).toFixed(2)}s;animation-duration:${rnd(1, 2.4).toFixed(2)}s`;
      bg.appendChild(s);
    }

    // 매달린 미러볼
    [[4, 70], [91, 110]].forEach(([left, len], i) => {
      const b = document.createElement("div");
      b.className = "ball";
      b.style.left = left + "%";
      b.style.animationDelay = (i * 0.7) + "s";
      b.innerHTML = `<div class="line" style="height:${len}px"></div><div class="orb">🪩</div>`;
      bg.appendChild(b);
    });

    // 빙글빙글 도는 고양이 (직접 그린 SVG)
    const palettes = [
      { fur: "#f4a259", belly: "#fff1de", ear: "#ff9eb5" },
      { fur: "#c9ced6", belly: "#f4f6f9", ear: "#ffb3c6" },
      { fur: "#4b4b58", belly: "#8a8a99", ear: "#ff9eb5" },
      { fur: "#f6e2bd", belly: "#fffaf0", ear: "#ffb3c6" },
    ];
    let n = 0;
    const addCat = (pos, size) => {
      const p = palettes[n % palettes.length];
      const spd = rnd(0.45, 0.8).toFixed(2);
      const el = document.createElement("div");
      el.className = "oiia";
      el.style.cssText = `${pos};width:${size}px;height:${size * 1.3}px;` +
        `--fur:${p.fur};--belly:${p.belly};--ear:${p.ear};--spd:${spd}s;animation-delay:${rnd(0, 1).toFixed(2)}s`;
      el.innerHTML = `<svg class="${n % 3 === 0 ? "rev" : ""}" viewBox="0 0 100 130"><use href="#catSym" width="100" height="130"/></svg>`;
      bg.appendChild(el);
      n++;
    };
    [10, 34, 58].forEach((t, i) => {            // 왼쪽 / 오른쪽 가장자리
      addCat(`left:${2 + i * 2}%;top:${t}%`, 96 - i * 8);
      addCat(`right:${2 + (2 - i) * 2}%;top:${t + 6}%`, 96 - i * 8);
    });
    [18, 32, 46, 60, 74].forEach(l => addCat(`left:${l}%;bottom:1%`, 64)); // 아래 줄
  })();

  function catParty() {
    const bg = $("bg");
    bg.classList.add("party");
    setTimeout(() => bg.classList.remove("party"), 3500);
  }

  // ---------- 현재(다수결) 인식된 손 모양 ----------
  function currentGesture() {
    if (!box || !votes.length) return null;
    const count = {};
    votes.forEach(k => count[k] = (count[k] || 0) + 1);
    return Object.keys(count).reduce((a, b) => count[b] > count[a] ? b : a);
  }

  function showMyGesture() {
    if (Date.now() < lockUntil) return;
    const g = currentGesture();
    $("myGesture").textContent = g ? label(g) : (box ? "인식 중..." : "손을 보여주세요");
  }

  // ---------- 손 검출 ----------
  function detectLoop() {
    if (video.readyState >= 2 && landmarker) {
      const res = landmarker.detectForVideo(video, performance.now());
      const W = overlay.width, H = overlay.height;
      octx.clearRect(0, 0, W, H);

      if (res.landmarks && res.landmarks.length) {
        const pts = res.landmarks[0];
        let minX = 1, minY = 1, maxX = 0, maxY = 0;
        for (const p of pts) {
          minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
          minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
        }
        const cx = (minX + maxX) / 2 * W, cy = (minY + maxY) / 2 * H;
        let size = Math.max((maxX - minX) * W, (maxY - minY) * H) * (1 + PAD * 2);
        size = Math.min(size, Math.min(W, H));
        const x = Math.max(0, Math.min(W - size, cx - size / 2));
        const y = Math.max(0, Math.min(H - size, cy - size / 2));
        box = { x, y, size };

        octx.lineWidth = 3; octx.strokeStyle = "#4ade80"; octx.shadowColor = "#4ade80"; octx.shadowBlur = 12;
        octx.strokeRect(x, y, size, size);
        octx.shadowBlur = 0; octx.fillStyle = "#ff6ec4";
        for (const p of pts) { octx.beginPath(); octx.arc(p.x * W, p.y * H, 4, 0, Math.PI * 2); octx.fill(); }
        setStatus("🟢 손 감지됨");
      } else {
        box = null; votes = [];
        setStatus("🔴 손이 보이지 않아요");
      }
      showMyGesture();
    }
    requestAnimationFrame(detectLoop);
  }

  // ---------- Roboflow 분류 ----------
  async function classify() {
    if (busy || !box) return;
    busy = true;
    try {
      const sx = box.x / overlay.width * video.videoWidth;
      const sy = box.y / overlay.height * video.videoHeight;
      const sw = box.size / overlay.width * video.videoWidth;
      const sh = box.size / overlay.height * video.videoHeight;
      cctx.drawImage(video, sx, sy, sw, sh, 0, 0, 224, 224);

      const base64 = crop.toDataURL("image/jpeg", 0.85).split(",")[1];
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: base64,
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();

      let preds = data.predictions;
      if (preds && !Array.isArray(preds)) {
        preds = Object.entries(preds).map(([k, v]) => ({ class: k, confidence: v.confidence }));
      }
      if (!preds || !preds.length) return;
      const top = preds.reduce((a, b) => b.confidence > a.confidence ? b : a);
      const key = pick(top.class);
      if (!key) return;
      votes.push(key);
      if (votes.length > VOTE_SIZE) votes.shift();
    } catch (e) {
      console.error(e);
      setStatus("⚠️ 오류: " + e.message);
    } finally {
      busy = false;
    }
  }

  // ---------- 게임 ----------
  function playRound() {
    const me = currentGesture();
    if (!me) {
      $("myGesture").textContent = "손을 인식하지 못했어요";
      $("comGesture").textContent = "-";
      setResult("다시 해 주세요", "");
      lockUntil = Date.now() + 2000;
      return;
    }
    const keys = Object.keys(INFO);
    const com = keys[Math.floor(Math.random() * keys.length)];

    let outcome;
    if (me === com) outcome = "draw";
    else if (BEATS[me] === com) outcome = "win";
    else outcome = "lose";

    score[outcome]++;
    $("myGesture").textContent = label(me);
    $("comGesture").textContent = label(com);
    $("winCnt").textContent = score.win;
    $("drawCnt").textContent = score.draw;
    $("loseCnt").textContent = score.lose;
    lockUntil = Date.now() + 3500;

    if (outcome === "win") {
      setResult("승 🎉", "win");
      launchFireworks(); playCheer(); catParty();
      setTimeout(shoutWin, 500);
    }
    if (outcome === "draw") setResult("무승부 🤝", "draw");
    if (outcome === "lose") setResult("패 😢", "lose");
  }

  function setResult(text, cls) {
    $("result").textContent = text;
    $("result").className = cls;
  }

  setInterval(() => {
    const cd = $("countdown");
    if (!running) { cd.style.display = "none"; return; }
    const left = Math.max(0, Math.ceil((nextRoundAt - Date.now()) / 1000));
    cd.style.display = "block";
    cd.textContent = left > 0 ? `⏱ ${left}초 후 판정 - 손 모양을 만드세요!` : "판정!";
    if (Date.now() >= nextRoundAt) {
      playRound();
      nextRoundAt = Date.now() + ROUND_SECONDS * 1000;
    }
  }, 100);

  $("startBtn").onclick = () => {
    score.win = score.draw = score.lose = 0;
    ["winCnt", "drawCnt", "loseCnt"].forEach(id => $(id).textContent = 0);
    $("comGesture").textContent = "-";
    setResult("-", "");
    initAudio();   // 브라우저 정책상 버튼 클릭 때 소리 재생 허용
    running = true;
    nextRoundAt = Date.now() + ROUND_SECONDS * 1000;
    $("startBtn").disabled = true;
    $("stopBtn").disabled = false;
  };
  $("stopBtn").onclick = () => {
    running = false;
    $("startBtn").disabled = false;
    $("stopBtn").disabled = true;
    lockUntil = 0;
    setResult(`게임 종료 (${score.win}승 ${score.draw}무 ${score.lose}패)`, "");
  };

  // ---------- 소리 ----------
  let audioCtx = null;
  // 같은 폴더에 oiia.mp3 파일을 두면 이긴 순간 그 소리를 재생합니다 (없으면 음성 합성으로 대체)
  const oiiaAudio = new Audio("oiia.mp3");
  oiiaAudio.preload = "auto";

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    if ("speechSynthesis" in window) {
      speechSynthesis.getVoices();
      speechSynthesis.speak(new SpeechSynthesisUtterance(""));
    }
  }

  function speak(parts) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const ko = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("ko"));
    parts.forEach(([text, pitch, rate]) => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ko-KR"; u.pitch = pitch; u.rate = rate; u.volume = 1;
      if (ko) u.voice = ko;
      speechSynthesis.speak(u);
    });
  }

  // "이겼습니다!" + 오이야 오이야 외치기
  function shoutWin() {
    oiiaAudio.currentTime = 0;
    oiiaAudio.play().then(() => {
      speak([["이겼습니다!", 1.6, 1.2]]);                 // oiia.mp3가 있으면 이것만 외침
    }).catch(() => {
      speak([                                              // 없으면 직접 외침
        ["이겼습니다!", 1.6, 1.2],
        ["오이야! 오이야!", 1.9, 1.5],
        ["오 이 아 에 아~", 1.9, 1.3],
      ]);
    });
  }

  function playCheer() {
    if (!audioCtx) return;
    const ac = audioCtx, t0 = ac.currentTime;
    const master = ac.createGain();
    master.gain.value = 0.9;
    master.connect(ac.destination);

    // 팡파르
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
      const t = t0 + i * 0.11;
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = "triangle"; osc.frequency.value = f;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.28, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, t + (i === 4 ? 0.9 : 0.3));
      osc.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + 1);
    });

    // 관중 환호성
    const dur = 2.6;
    const buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const noise = ac.createBufferSource(); noise.buffer = buf;

    const bp = ac.createBiquadFilter();
    bp.type = "bandpass"; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(700, t0 + 0.2);
    bp.frequency.linearRampToValueAtTime(1800, t0 + 0.9);
    bp.frequency.linearRampToValueAtTime(1100, t0 + dur);

    const ng = ac.createGain();
    ng.gain.setValueAtTime(0, t0 + 0.2);
    ng.gain.linearRampToValueAtTime(0.75, t0 + 0.7);
    ng.gain.setValueAtTime(0.75, t0 + 1.5);
    ng.gain.exponentialRampToValueAtTime(0.001, t0 + dur);

    const lfo = ac.createOscillator(), lfoGain = ac.createGain();
    lfo.frequency.value = 9; lfoGain.gain.value = 0.22;
    lfo.connect(lfoGain); lfoGain.connect(ng.gain);

    noise.connect(bp); bp.connect(ng); ng.connect(master);
    noise.start(t0 + 0.2); lfo.start(t0 + 0.2);
    noise.stop(t0 + dur); lfo.stop(t0 + dur);

    // 박수
    for (let i = 0; i < 26; i++) {
      const t = t0 + 0.9 + i * 0.07 + Math.random() * 0.04;
      const n = ac.createBufferSource(); n.buffer = buf;
      const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1800;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.35, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      n.connect(hp); hp.connect(g); g.connect(master);
      n.start(t, Math.random()); n.stop(t + 0.06);
    }
  }

  // ---------- 폭죽 ----------
  const fwCanvas = $("fireworks"), fctx = fwCanvas.getContext("2d");
  let particles = [], fwRunning = false;
  function resizeFw() { fwCanvas.width = innerWidth; fwCanvas.height = innerHeight; }
  addEventListener("resize", resizeFw); resizeFw();

  function burst(x, y) {
    const hue = Math.random() * 360;
    for (let i = 0; i < 90; i++) {
      const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 6;
      particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1,
        decay: 0.008 + Math.random() * 0.012,
        color: `hsl(${hue + Math.random() * 60}, 100%, ${55 + Math.random() * 20}%)`,
      });
    }
  }
  function fwFrame() {
    fctx.globalCompositeOperation = "destination-out";
    fctx.fillStyle = "rgba(0,0,0,0.22)";
    fctx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);
    fctx.globalCompositeOperation = "lighter";
    particles = particles.filter(p => p.life > 0);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.vx *= 0.985; p.life -= p.decay;
      fctx.globalAlpha = Math.max(p.life, 0);
      fctx.fillStyle = p.color;
      fctx.beginPath(); fctx.arc(p.x, p.y, 2.6, 0, Math.PI * 2); fctx.fill();
    }
    fctx.globalAlpha = 1;
    if (particles.length) requestAnimationFrame(fwFrame);
    else { fwRunning = false; fctx.clearRect(0, 0, fwCanvas.width, fwCanvas.height); }
  }
  function launchFireworks() {
    for (let i = 0; i < 7; i++) {
      setTimeout(() => burst(
        fwCanvas.width * (0.15 + Math.random() * 0.7),
        fwCanvas.height * (0.12 + Math.random() * 0.45)
      ), i * 280);
    }
    if (!fwRunning) { fwRunning = true; requestAnimationFrame(fwFrame); }
  }

  // ---------- 시작 ----------
  async function init() {
    try {
      setStatus("카메라 켜는 중...");
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 960, height: 720, facingMode: "user" }, audio: false
      });
      video.srcObject = stream;
      await new Promise(r => video.onloadedmetadata = r);
      overlay.width = video.videoWidth; overlay.height = video.videoHeight;

      setStatus("손 인식 모델 불러오는 중...");
      const fileset = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
      landmarker = await HandLandmarker.createFromOptions(fileset, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        },
        runningMode: "VIDEO", numHands: 1,
      });

      $("startBtn").disabled = false;
      setStatus("✅ 준비 완료 - '게임 시작'을 누르세요");
      detectLoop();
      setInterval(classify, CLASSIFY_INTERVAL);
    } catch (e) {
      console.error(e);
      setStatus("⚠️ " + e.message);
    }
  }
  init();
</script>
